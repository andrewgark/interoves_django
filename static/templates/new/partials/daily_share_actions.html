<div class="new-raddle-result__actions">
  <button type="button"
          class="new-btn new-btn--ghost new-btn--icon new-btn--mini new-raddle-result__copy"
          data-share-copy-text
          aria-label="Скопировать результат"
          title="Скопировать результат">
    <i class="ph ph-copy" aria-hidden="true"></i>
  </button>
  <button type="button"
          class="new-btn new-btn--ghost new-btn--icon new-btn--mini"
          data-share-copy-image
          aria-label="Скопировать картинку"
          title="Скопировать картинку">
    <span class="new-share-icon new-share-icon--copy-image" aria-hidden="true">
      <i class="ph ph-image-square"></i>
      <i class="ph ph-copy"></i>
    </span>
  </button>
  <button type="button"
          class="new-btn new-btn--mini"
          data-share-native
          aria-label="Поделиться"
          title="Поделиться">
    <i class="ph ph-arrow-up-right" aria-hidden="true"></i>
    Поделиться
  </button>
</div>
<span class="new-visually-hidden" data-share-status role="status" aria-live="polite"></span>
