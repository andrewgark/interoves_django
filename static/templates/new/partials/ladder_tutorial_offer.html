{# First visit to a Ladder: offer the tutorial before the board and its clock start. #}
<div id="ladder-tutorial-offer" class="new-rules-modal" role="dialog" aria-modal="true" aria-labelledby="ladder-tutorial-offer-title" hidden>
  <div class="new-rules-overlay"></div>
  <div class="new-rules-modal__box pal-card ladder-tutorial-offer">
    <button type="button" class="new-rules-modal__close" aria-label="Закрыть" data-ladder-tutorial-offer-skip><i class="ph ph-x" aria-hidden="true"></i></button>
    <h2 id="ladder-tutorial-offer-title" class="pal-title">Впервые в Лесенке?</h2>
    <p>Пройди короткое обучение на маленькой Лесенке — это около минуты. Потом вернёшься сюда.</p>
    <div class="new-rules-modal__actions">
      <a class="new-btn" href="{{ ladder_tutorial_entry_url }}" data-ladder-tutorial-offer-accept>Пройти обучение</a>
      <button type="button" class="new-btn new-btn--text" data-ladder-tutorial-offer-skip>Сразу играть</button>
    </div>
  </div>
</div>
<script>
(function () {
  // The solving clock waits for the answer (task_group.html binds it after
  // interovesTimerGate): a player who leaves for the tutorial never starts it.
  var modal = document.getElementById('ladder-tutorial-offer');
  var DECLINED_KEY = 'interoves_ladder_tutorial_offer';
  var TUTORIAL_KEY = 'interoves_tutorial_ladder_v1';
  function seen() {
    try {
      if (localStorage.getItem(DECLINED_KEY)) return true;
      var saved = JSON.parse(localStorage.getItem(TUTORIAL_KEY) || '{}');
      return !!saved.status;
    } catch (e) {
      return true;
    }
  }
  function track(name) {
    try {
      if (window.interovesAnalytics && typeof window.interovesAnalytics.trackYandexGoal === 'function') {
        window.interovesAnalytics.trackYandexGoal(name, {game: 'ladder'});
      }
    } catch (e) {}
  }
  if (!modal || seen()) return;
  var release;
  window.interovesTimerGate = new Promise(function (resolve) { release = resolve; });
  modal.hidden = false;
  modal.classList.add('is-open');
  document.body.style.overflow = 'hidden';
  track('ladder_tutorial_offer_shown');
  modal.querySelector('[data-ladder-tutorial-offer-accept]').addEventListener('click', function () {
    track('ladder_tutorial_offer_accept');
  });
  function skip() {
    if (modal.hidden) return;
    try { localStorage.setItem(DECLINED_KEY, 'declined'); } catch (e) {}
    modal.hidden = true;
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
    track('ladder_tutorial_offer_skip');
    release();
  }
  modal.querySelectorAll('[data-ladder-tutorial-offer-skip]').forEach(function (button) {
    button.addEventListener('click', skip);
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') skip();
  });
})();
</script>
