{% load static %}
{# Popup layer of the tutorial Ladder. The board under it is the regular play page. #}
<div data-ladder-tutorial data-tutorial-game="{{ ladder_tutorial.game }}" data-tutorial-version="{{ ladder_tutorial.version }}">
<div class="new-rules-modal tutorial-shell" data-tutorial-shell role="dialog"
     aria-modal="false" aria-labelledby="tutorial-title" hidden>
  <div class="new-rules-overlay tutorial-shell__backdrop" data-tutorial-close></div>
  <div class="tutorial-shell__spotlights" data-tutorial-spotlights aria-hidden="true"></div>
  <section class="new-rules-modal__box pal-card tutorial-shell__callout">
    <div class="tutorial-shell__top">
      <span data-tutorial-progress></span>
      <button type="button" class="new-rules-modal__close tutorial-shell__close" aria-label="Закрыть туториал" data-tutorial-close><i class="ph ph-x" aria-hidden="true"></i></button>
    </div>
    <h2 id="tutorial-title" class="pal-title" data-tutorial-title></h2>
    <p class="tutorial-shell__text" data-tutorial-text></p>
    <p class="tutorial-shell__feedback" data-tutorial-feedback-global role="status" aria-live="polite"></p>
    <div class="new-rules-modal__actions">
      <button type="button" class="new-btn" data-tutorial-next>Дальше</button>
    </div>
  </section>
</div>
<section class="new-raddle-result ladder-tutorial-next" data-ladder-tutorial-next hidden aria-live="polite">
  <div class="new-raddle-result__head"><span class="new-raddle-result__label">Обучающая Лесенка решена</span></div>
  <a href="{{ ladder_tutorial.today_url }}" class="new-btn">Решить сегодняшнюю Лесенку</a>
</section>
</div>
{{ ladder_tutorial|json_script:"ladder-tutorial-data" }}
<script src="{% static 'js/tutorial_shell.js' %}?v={{ site_deploy_version|default:'0'|urlencode }}-real-page-v9"></script>
<script src="{% static 'js/ladder_tutorial.js' %}?v={{ site_deploy_version|default:'0'|urlencode }}-real-page-v9"></script>
