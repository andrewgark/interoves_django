{% if difficulty.show %}
<span class="new-difficulty"
      title="{{ difficulty.tooltip }}"
      role="img"
      aria-label="{{ difficulty.tooltip }}">
  <span class="new-difficulty__stars" aria-hidden="true">
    {% for filled in difficulty.star_slots %}<i class="{% if filled %}ph-fill{% else %}ph{% endif %} ph-star{% if not filled %} new-difficulty__star--empty{% endif %}"></i>{% endfor %}
  </span>
</span>
{% endif %}
