{% load filters static %}
        <li class="new-raddle-clue new-raddle-clue--used{% if hint.reaction %} new-raddle-clue--voted{% endif %}" data-hint-index="{{ hint.index }}">
          <span class="new-raddle-clue__text">{% autoescape off %}{{ hint.display_html }}{% endautoescape %}</span>
          {% if hint.reaction %}{% with r=hint.reaction %}
          <span class="new-vote" data-vote data-lead="{{ r.likes|vote_lead:r.dislikes }}" role="group" aria-label="Оценка подсказки">
            <button type="button" class="new-vote__side new-vote__side--up{% if r.liked %} is-active{% endif %}" data-clue-like-btn data-task-id="{{ task.id }}" data-hint-index="{{ hint.index }}" data-liked="{% if r.liked %}1{% else %}0{% endif %}" aria-pressed="{% if r.liked %}true{% else %}false{% endif %}" data-tooltip="Хорошая подсказка" aria-label="Хорошая подсказка, лайков: {{ r.likes }}" tabindex="-1">{% include "site/partials/vote_arrow.html" with dir="up" %}<span class="new-vote__count" data-clue-like-count{% if not r.likes %} data-zero{% endif %}>{{ r.likes }}</span></button>
            <button type="button" class="new-vote__side new-vote__side--down{% if r.disliked %} is-active{% endif %}" data-clue-dislike-btn data-task-id="{{ task.id }}" data-hint-index="{{ hint.index }}" data-disliked="{% if r.disliked %}1{% else %}0{% endif %}" aria-pressed="{% if r.disliked %}true{% else %}false{% endif %}" data-tooltip="Плохая подсказка" aria-label="Плохая подсказка, дизлайков: {{ r.dislikes }}" tabindex="-1">{% include "site/partials/vote_arrow.html" with dir="down" %}<span class="new-vote__count" data-clue-dislike-count{% if not r.dislikes %} data-zero{% endif %}>{{ r.dislikes }}</span></button>
          </span>
          {% endwith %}{% endif %}
        </li>
