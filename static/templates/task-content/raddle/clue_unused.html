{% load filters static %}
        <li class="new-raddle-clue{% if hint.is_revealed %} new-raddle-clue--revealed{% endif %}{% if hint.is_struck %} new-raddle-clue--struck{% endif %}"
            data-hint-index="{{ hint.index }}"
            data-blank-template="{{ hint.blank_template|escape }}"
            {% comment %}A tournament page must not carry unsolved answers in its markup.{% endcomment %}
            data-prev-word="{% if hint.prev_solved or not rd.ui.is_tournament %}{{ hint.prev_word|escape }}{% endif %}"
            data-next-word="{% if hint.next_solved or not rd.ui.is_tournament %}{{ hint.next_word|escape }}{% endif %}"
            data-prev-solved="{% if hint.prev_solved %}1{% else %}0{% endif %}"
            data-next-solved="{% if hint.next_solved %}1{% else %}0{% endif %}"
            data-has-next-slot="{% if hint.has_next_slot %}1{% else %}0{% endif %}"
            {% if hint.clue_variant %}data-clue-variant="{{ hint.clue_variant }}"{% endif %}>
          <button type="button" class="new-raddle-clue__mark" aria-pressed="{% if hint.is_struck %}true{% else %}false{% endif %}" aria-label="Отметить подсказку" data-tooltip="Отметить" tabindex="-1"></button>
          <span class="new-raddle-clue__text">{% autoescape off %}{{ hint.display_html }}{% endautoescape %}</span>
        </li>
