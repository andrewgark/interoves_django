{% if daily_archive %}
{% if daily_archive_previous or daily_archive_next %}
<nav class="new-tg-pager daily-archive__pager" aria-label="Навигация по месяцам">
  {% if daily_archive_previous %}
    <a class="new-tg-pager__link new-tg-pager__link--prev" href="{{ daily_archive_previous.href }}" aria-label="Предыдущий месяц: {{ daily_archive_previous.month_label }}">
      <span class="new-tg-pager__dir"><i class="ph ph-caret-left" aria-hidden="true"></i> Назад</span>
      <span class="new-tg-pager__label">{{ daily_archive_previous.month_label }}</span>
    </a>
  {% else %}
    <span class="new-tg-pager__spacer" aria-hidden="true"></span>
  {% endif %}
  {% if daily_archive_next %}
    <a class="new-tg-pager__link new-tg-pager__link--next" href="{{ daily_archive_next.href }}" aria-label="Следующий месяц: {{ daily_archive_next.month_label }}">
      <span class="new-tg-pager__dir">Дальше <i class="ph ph-caret-right" aria-hidden="true"></i></span>
      <span class="new-tg-pager__label">{{ daily_archive_next.month_label }}</span>
    </a>
  {% endif %}
</nav>
{% endif %}
{% endif %}
