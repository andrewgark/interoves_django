# Baseline for gradual cleanup (see docs/code-health-roadmap.md §2).
target-version = "py312"
line-length = 120
src = ["games", "interoves_django", "microsites", "scripts"]

[lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[lint.per-file-ignores]
"games/migrations/*.py" = ["E501", "I"]
# URL facade: imports exist for ``ui.<name>`` re-exports, not local use.
"games/site/views/pages/ui.py" = ["F401", "I001"]
# Offline Censorly scripts bootstrap Django, then import. Moved unchanged.
"games/puzzles/censorly/offline/**/*.py" = ["E402", "E701", "F401", "F541", "F811", "F841"]
