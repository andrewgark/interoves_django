<!--
  Логический сапёр для тела задания (обычный чекер, ответ — слово).
  Вставить весь файл в task.text. Поле — data-msw-grid: строка на ряд,
  "." закрытая клетка, цифра — открытая. Здесь демо-поле 5×7;
  настоящие поля игр в публичный репозиторий не коммитить. Решение в странице не хранится:
  при единственном решении и отсутствии клеток без соседних цифр
  «всё отмечено и нет противоречий» ⇔ «верно» (рамка становится зелёной).
-->
<div class="msw" data-msw-grid="
....1.0
36.5...
.4...6.
2.5....
.2...5.
">
  <div class="msw__board" role="group" aria-label="Поле сапёра"></div>
  <div class="msw__tip" hidden></div>
  <p class="msw__status new-visually-hidden" aria-live="polite"></p>
  <div class="msw__bar">
    <p class="msw__help">
      <span class="msw__help-mouse">Левая кнопка — флажок, правая — пустая клетка. Можно вести мышью с зажатой кнопкой.</span>
      <span class="msw__help-touch">Нажатие по клетке: флажок → пусто → ничего.</span>
    </p>
    <div class="msw__actions">
      <button type="button" class="new-btn new-btn--ghost new-btn--mini" data-msw-undo disabled>Отменить</button>
      <button type="button" class="new-btn new-btn--ghost new-btn--mini" data-msw-reset>Сбросить</button>
    </div>
  </div>
</div>
<style>
.msw {
  --msw-cols: 16;
  --msw-open: #dcefdc;
  --msw-closed: #fff;
  --msw-line: #b9c2bd;
  --msw-ink: #1a1a1a;
  --msw-frame: #1a1a1a;
  --msw-flag: #d62f2f;
  --msw-bad: #e0362c;
  --msw-ok: #2e9b55;
  position: relative;
  margin: 0.75rem 0;
  container-type: inline-size;
}
html.new-ui-dark .msw {
  --msw-open: #23392f;
  --msw-closed: #1a1c1b;
  --msw-line: #3a3f3d;
  --msw-ink: #d7dadc;
  --msw-frame: #d7dadc;
  --msw-flag: #f05252;
  --msw-bad: #f87171;
  --msw-ok: #3fb89a;
}
.msw__board {
  display: grid;
  grid-template-columns: repeat(var(--msw-cols), 1fr);
  width: 100%;
  max-width: calc(var(--msw-cols) * 2.4rem);
  border: 3px solid var(--msw-frame);
  border-radius: 4px;
  background: var(--msw-line);
  gap: 1px;
  box-sizing: border-box;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.msw.is-solved .msw__board {
  border-color: var(--msw-ok);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--msw-ok) 30%, transparent);
}
.msw__cell {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--msw-closed);
  color: var(--msw-ink);
  font: 700 18px/1 var(--new-font-mono, "Noto Sans Mono", monospace);
  font-size: min(18px, calc(100cqi / var(--msw-cols) * 0.5));
  cursor: pointer;
}
.msw__cell--num,
.msw__cell--safe {
  background: var(--msw-open);
}
.msw__cell--num {
  cursor: default;
}
.msw__cell--num.is-bad::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 2px var(--msw-bad);
  pointer-events: none;
}
.msw__cell--num.is-bad {
  color: var(--msw-bad);
  cursor: help;
}
.msw__cell svg {
  width: 62%;
  height: 62%;
  pointer-events: none;
}
@media (hover: hover) {
  .msw__cell:not(.msw__cell--num):hover {
    filter: brightness(0.94);
  }
  html.new-ui-dark .msw__cell:not(.msw__cell--num):hover {
    filter: brightness(1.25);
  }
}
.msw__tip {
  position: absolute;
  z-index: 5;
  transform: translate(-50%, calc(-100% - 6px));
  padding: 0.3rem 0.55rem;
  border-radius: 6px;
  background: #1a1a1a;
  color: #fff;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
  font-size: 0.8rem;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
}
.msw__tip::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 100%;
  margin-left: -5px;
  border: 5px solid transparent;
  border-top-color: #1a1a1a;
}
.msw__tip--below {
  transform: translate(-50%, 6px);
}
.msw__tip--below::after {
  top: auto;
  bottom: 100%;
  border-top-color: transparent;
  border-bottom-color: #1a1a1a;
}
.msw__bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem 0.75rem;
  max-width: calc(var(--msw-cols) * 2.4rem);
  margin-top: 0.45rem;
}
.msw__help {
  margin: 0;
  color: var(--muted, #5c6560);
  font-size: 0.82rem;
  line-height: 1.4;
}
.msw__help-touch { display: none; }
@media (hover: none) {
  .msw__help-mouse { display: none; }
  .msw__help-touch { display: inline; }
}
.msw__actions {
  display: flex;
  gap: 0.4rem;
}
</style>
<script>
(function () {
  'use strict';
  // The site swaps a task card via outerHTML after every attempt, and inline
  // scripts in the new card never run. So the first run installs one global
  // setup + MutationObserver that also wires boards inserted later; marks and
  // undo history live in a per-grid session that outlives the card.
  var NS = window.InterovesMinesweeper;
  if (!NS) {
    NS = window.InterovesMinesweeper = { sessions: {}, tips: [] };
    NS.setupAll = function (scope) {
      var roots = scope.querySelectorAll ? scope.querySelectorAll('.msw:not([data-msw-ready])') : [];
      if (scope.matches && scope.matches('.msw:not([data-msw-ready])')) setup(scope);
      Array.prototype.forEach.call(roots, setup);
    };
    if (window.MutationObserver) {
      new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          Array.prototype.forEach.call(m.addedNodes, function (node) {
            if (node.nodeType === 1) NS.setupAll(node);
          });
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
    }
    document.addEventListener('pointerdown', function (e) {
      NS.tips = NS.tips.filter(function (t) { return t.root.isConnected; });
      NS.tips.forEach(function (t) { if (!t.board.contains(e.target)) t.hide(); });
    });
  }
  NS.setupAll(document);

  function plural(n) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'бомба';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'бомбы';
    return 'бомб';
  }

  var FLAG_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M6 3v18M3.5 21h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
    '<path d="M7 3.5 19 8.5 7 13.5Z" fill="var(--msw-flag)"/>' +
    '</svg>';

  function setup(root) {
    root.setAttribute('data-msw-ready', '1');
    var rows = (root.getAttribute('data-msw-grid') || '').trim().split(/\s+/);
    if (!rows[0]) return;
    var R = rows.length, C = rows[0].length;
    root.style.setProperty('--msw-cols', C);
    var board = root.querySelector('.msw__board');
    var tip = root.querySelector('.msw__tip');
    var status = root.querySelector('.msw__status');
    var undoBtn = root.querySelector('[data-msw-undo]');
    var resetBtn = root.querySelector('[data-msw-reset]');
    var storeKey = 'msw:' + rows.join('/');

    var clue = [], els = [], neighbours = [];
    for (var r = 0; r < R; r += 1) {
      for (var c = 0; c < C; c += 1) {
        var i = r * C + c;
        var ch = rows[r].charAt(c);
        clue[i] = /\d/.test(ch) ? Number(ch) : null;
        var list = [];
        for (var dr = -1; dr <= 1; dr += 1) {
          for (var dc = -1; dc <= 1; dc += 1) {
            var rr = r + dr, cc = c + dc;
            if ((dr || dc) && rr >= 0 && cc >= 0 && rr < R && cc < C && !/\d/.test(rows[rr].charAt(cc))) list.push(rr * C + cc);
          }
        }
        neighbours[i] = list;
        var el = document.createElement('div');
        el.className = 'msw__cell' + (clue[i] !== null ? ' msw__cell--num' : '');
        el.setAttribute('data-i', i);
        if (clue[i] !== null) el.textContent = clue[i];
        board.appendChild(el);
        els[i] = el;
      }
    }

    var session = NS.sessions[storeKey];
    if (!session) {
      session = NS.sessions[storeKey] = { state: clue.map(function () { return ''; }), history: [] };
      try {
        var saved = JSON.parse(localStorage.getItem(storeKey) || 'null');
        if (saved && saved.length === clue.length) {
          session.state = saved.map(function (v, k) { return clue[k] === null && (v === 'flag' || v === 'safe') ? v : ''; });
        }
      } catch (e) { /* storage unavailable: keep the in-memory session */ }
    }

    function save() {
      try { localStorage.setItem(storeKey, JSON.stringify(session.state)); } catch (e) { /* ignore */ }
    }

    var wasSolved = null;
    function render() {
      var state = session.state, allSet = true, anyBad = false;
      for (var k = 0; k < state.length; k += 1) {
        var el = els[k];
        if (clue[k] === null) {
          var s = state[k];
          if (!s) allSet = false;
          if (el.getAttribute('data-s') !== s) {
            el.setAttribute('data-s', s);
            el.classList.toggle('msw__cell--safe', s === 'safe');
            el.innerHTML = s === 'flag' ? FLAG_SVG : '';
          }
          continue;
        }
        var flags = 0, open = 0;
        neighbours[k].forEach(function (n) {
          if (state[n] === 'flag') flags += 1;
          else if (!state[n]) open += 1;
        });
        var bad = flags > clue[k] || flags + open < clue[k];
        if (bad) anyBad = true;
        el.classList.toggle('is-bad', bad);
        if (bad) el.setAttribute('data-tip', 'Вокруг не может быть ' + clue[k] + ' ' + plural(clue[k]));
        else el.removeAttribute('data-tip');
      }
      var solved = allSet && !anyBad;
      root.classList.toggle('is-solved', solved);
      if (status && wasSolved !== null && solved !== wasSolved) {
        status.textContent = solved ? 'Все клетки отмечены без противоречий.' : '';
      }
      wasSolved = solved;
      undoBtn.disabled = !session.history.length;
      if (tipFor) showTip(tipFor);
    }

    // Tooltip for contradicted clues: hover on desktop, tap on touch.
    var tipFor = null;
    function showTip(el) {
      var text = el && el.getAttribute('data-tip');
      if (!text) { hideTip(); return; }
      tipFor = el;
      tip.textContent = text;
      tip.hidden = false;
      var rb = root.getBoundingClientRect(), eb = el.getBoundingClientRect();
      var half = tip.offsetWidth / 2;
      var x = Math.max(half, Math.min(rb.width - half, eb.left - rb.left + eb.width / 2));
      // .new-taskcard__text scrolls horizontally, which also clips vertically:
      // flip the tip under the cell when the clipping box has no room above.
      var below = eb.top - clipTop() < tip.offsetHeight + 8;
      tip.classList.toggle('msw__tip--below', below);
      tip.style.left = x + 'px';
      tip.style.top = ((below ? eb.bottom : eb.top) - rb.top) + 'px';
    }
    function clipTop() {
      var top = 0;
      for (var a = root.parentElement; a && a !== document.body; a = a.parentElement) {
        var s = getComputedStyle(a);
        if (s.overflowX !== 'visible' || s.overflowY !== 'visible') top = Math.max(top, a.getBoundingClientRect().top);
      }
      return top;
    }
    function hideTip() { tipFor = null; tip.hidden = true; }
    NS.tips.push({ root: root, board: board, hide: hideTip });

    function cellOf(event) {
      var target = document.elementFromPoint(event.clientX, event.clientY);
      var el = target && target.closest ? target.closest('.msw__cell') : null;
      return el && board.contains(el) ? Number(el.getAttribute('data-i')) : -1;
    }

    function pushHistory() {
      session.history.push(session.state.slice());
      if (session.history.length > 300) session.history.shift();
    }

    var drag = null;
    function paint(k, value) {
      if (k < 0 || clue[k] !== null || session.state[k] === value) return;
      if (!drag.dirty) { drag.dirty = true; pushHistory(); }
      session.state[k] = value;
      render();
    }

    board.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    board.addEventListener('pointerdown', function (e) {
      var k = cellOf(e);
      if (k < 0) return;
      if (clue[k] !== null) {
        if (e.pointerType !== 'mouse') showTip(els[k]);
        return;
      }
      e.preventDefault();
      hideTip();
      var cur = session.state[k], next;
      if (e.pointerType === 'mouse') {
        // Ctrl+click is the right click on a one-button Mac mouse/trackpad.
        var right = e.button === 2 || (e.button === 0 && e.ctrlKey);
        if (right) next = cur === 'safe' ? '' : 'safe';
        else if (e.button === 0) next = cur === 'flag' ? '' : 'flag';
        else return;
      } else {
        next = cur === '' ? 'flag' : cur === 'flag' ? 'safe' : '';
      }
      // A finger tap often drifts across a cell border; only paint further
      // cells once a touch has really moved (mouse paints right away).
      drag = { value: next, dirty: false, last: k, x0: e.clientX, y0: e.clientY, armed: e.pointerType === 'mouse' };
      if (board.setPointerCapture) board.setPointerCapture(e.pointerId);
      paint(k, next);
    });
    board.addEventListener('pointermove', function (e) {
      if (!drag) {
        if (e.pointerType === 'mouse') {
          var h = cellOf(e);
          if (h >= 0 && els[h].getAttribute('data-tip')) showTip(els[h]);
          else if (tipFor) hideTip();
        }
        return;
      }
      if (!drag.armed) {
        var size = els[0].getBoundingClientRect().width;
        if (Math.abs(e.clientX - drag.x0) < size * 0.6 && Math.abs(e.clientY - drag.y0) < size * 0.6) return;
        drag.armed = true;
      }
      var k = cellOf(e);
      if (k < 0 || k === drag.last) return;
      drag.last = k;
      paint(k, drag.value);
    });
    function endDrag() {
      if (drag && drag.dirty) save();
      drag = null;
    }
    board.addEventListener('pointerup', endDrag);
    board.addEventListener('pointercancel', endDrag);
    board.addEventListener('lostpointercapture', endDrag);
    board.addEventListener('pointerleave', function (e) { if (!drag && e.pointerType === 'mouse') hideTip(); });

    undoBtn.addEventListener('click', function () {
      if (!session.history.length) return;
      session.state = session.history.pop();
      save();
      render();
    });
    resetBtn.addEventListener('click', function () {
      if (!session.state.some(Boolean)) return;
      if (!window.confirm('Стереть все отметки?')) return;
      pushHistory();
      session.state = session.state.map(function () { return ''; });
      save();
      render();
    });

    render();
  }
})();
</script>
