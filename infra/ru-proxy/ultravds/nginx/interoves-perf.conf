# UltraVDS: /etc/nginx/conf.d/interoves-perf.conf (http{} level).
#
# Without Cloudflare in front, ru.interoves.com needs its own compression and
# edge cache. Ubuntu's nginx.conf only has `gzip on;`, which covers
# text/html alone.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/manifest+json image/svg+xml
           application/xml text/xml;

# /static/ and /media/ served from this disk instead of a round trip to AWS.
proxy_cache_path /var/cache/nginx/interoves levels=1:2
                 keys_zone=interoves_static:20m max_size=2g inactive=30d
                 use_temp_path=off;
