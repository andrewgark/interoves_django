# UltraVDS: /etc/nginx/snippets/interoves-proxy.conf
#
# Shared by every location of ru.interoves.com: nginx drops inherited
# proxy_set_header directives in a location that sets its own.

proxy_pass http://interoves_origin;
proxy_http_version 1.1;

# Django accepts ru.interoves.com (ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS).
proxy_set_header Host $host;

# Overwrite, never append: a client-supplied X-Forwarded-For must not
# become the "client IP" in Django logs.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  "";
proxy_set_header Forwarded         "";

# Channels WebSockets (/ws/track/, /games/<id>/track); long-lived like the
# EB Nginx config. An empty Connection keeps upstream keepalive for the rest.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $interoves_connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
# A dead gateway hangs rather than refusing; 5 s still covers a WireGuard
# handshake over DERP to an idle peer.
proxy_connect_timeout 5s;
