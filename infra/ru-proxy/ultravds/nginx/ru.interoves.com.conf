# UltraVDS: /etc/nginx/sites-available/ru.interoves.com (symlinked into
# sites-enabled). ru.interoves.com -> Tailscale -> Interoves origin.
#
# Also install, from this directory:
#   interoves-perf.conf  -> /etc/nginx/conf.d/interoves-perf.conf
#   interoves-proxy.conf -> /etc/nginx/snippets/interoves-proxy.conf
#   mkdir -p /var/cache/nginx/interoves && chown www-data: /var/cache/nginx/interoves
#
# Upstreams live in a generated file (see ../ts-upstream-sync.sh) so
# replacing the AWS-side Tailscale gateway never needs a hand edit here.
# Seed it before the first reload:
#
#   echo 'server 100.93.29.79:80 max_fails=1 fail_timeout=30s;' \
#     > /etc/nginx/interoves-upstreams.conf

upstream interoves_origin {
    include /etc/nginx/interoves-upstreams.conf;
    keepalive 16;
}

map $http_upgrade $interoves_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    server_name ru.interoves.com;

    client_max_body_size 25M;

    location / {
        include snippets/interoves-proxy.conf;
    }

    # collectstatic output under a per-release prefix never changes, so it
    # is cached here and in browsers for a year regardless of S3 headers.
    location ^~ /static/releases/ {
        include snippets/interoves-proxy.conf;
        proxy_cache interoves_static;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Other static and uploaded media: cache, but honour the origin headers.
    location ~ ^/(static|media)/ {
        include snippets/interoves-proxy.conf;
        proxy_cache interoves_static;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/ru.interoves.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ru.interoves.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = ru.interoves.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ru.interoves.com;
    return 404; # managed by Certbot


}
