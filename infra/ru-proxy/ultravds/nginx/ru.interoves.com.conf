# UltraVDS: public entry for ru.interoves.com.  NOT APPLIED AUTOMATICALLY.
#
# Install: /etc/nginx/sites-available/ru.interoves.com (symlink into
# sites-enabled), then `nginx -t && systemctl reload nginx`.
#
# Upstreams live in a generated file (see ts-upstream-sync.sh) so replacing the
# AWS-side Tailscale node never needs a hand edit here. Seed it with the
# current node so the first reload keeps today's route:
#
#   echo 'server 100.93.29.79:80 max_fails=2 fail_timeout=10s;' \
#     > /etc/nginx/interoves-upstreams.conf

upstream interoves_origin {
    include /etc/nginx/interoves-upstreams.conf;
    keepalive 16;
}

map $http_upgrade $interoves_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name ru.interoves.com;
    return 301 https://ru.interoves.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ru.interoves.com;

    # Keep the existing certificate paths of this server.
    ssl_certificate     /etc/letsencrypt/live/ru.interoves.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru.interoves.com/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://interoves_origin;
        proxy_http_version 1.1;

        # Step 1 of the migration keeps `Host: interoves.com` (today's value).
        # Switch to $host only AFTER the Django release that adds
        # ru.interoves.com to ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS is live:
        #   curl -sS -o /dev/null -w '%{http_code}\n' \
        #     -H 'Host: ru.interoves.com' http://100.93.29.79/health/live/   # expect 200
        proxy_set_header Host $host;

        # Overwrite, never append: a client-supplied X-Forwarded-For must not
        # become the "client IP" in Django logs.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header Forwarded         "";

        # Channels WebSockets (/ws/track/, /games/<id>/track): the client
        # pings every 25 s; the long timeouts match the EB Nginx config.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $interoves_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
    }
}
