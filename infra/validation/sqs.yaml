AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable Inter Oves Word Salad validation SQS queue and DLQ.
Parameters:
  NamePrefix:
    Type: String
    Default: interoves-validation-word-salad
Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${NamePrefix}-dlq'
      MessageRetentionPeriod: 1209600
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref NamePrefix
      VisibilityTimeout: 180
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 8
Outputs:
  QueueUrl:
    Value: !Ref Queue
  QueueArn:
    Value: !GetAtt Queue.Arn
  DeadLetterQueueArn:
    Value: !GetAtt DeadLetterQueue.Arn
