AWSTemplateFormatVersion: '2010-09-09'
Description: Shared ECS foundation for Interoves worker services.

Parameters:
  ClusterName:
    Type: String
    Default: interoves-workers
  ExecutionRoleName:
    Type: String
    Default: interoves-ecs-task-execution-role

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ClusterName: !Ref ClusterName
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ExecutionRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadInterovesProductionParameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Worker secrets are SecureStrings under the aws/ssm key; ECS
              # resolves the task definition `Secrets` with this role.
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/interoves/production/*'
      Tags:
        - Key: Service
          Value: interoves-workers

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ClusterName:
    Value: !Ref Cluster
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
