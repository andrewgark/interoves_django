AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege ECS task role for one Interoves worker.

Parameters:
  WorkerName:
    Type: String
    AllowedValues: [background, identity, integrations, recheck]
  QueueArn:
    Type: String
  ConfigSecretArns:
    Type: CommaDelimitedList
    Description: Exact Secrets Manager ARNs referenced by the worker config map.
  ValidationQueueArn:
    Type: String
    Default: ''
    Description: Optional disposable validation queue; omit for normal deployments.

Conditions:
  HasValidationQueue: !Not [!Equals [!Ref ValidationQueueArn, '']]
  IsRecheck: !Equals [!Ref WorkerName, recheck]

Resources:
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub interoves-${WorkerName}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConsumeConfiguredWorkerQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConsumeConfiguredWorkerQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !Ref QueueArn
        - PolicyName: ReadWorkerRuntimeConfiguration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWorkerRuntimeConfiguration
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !Ref ConfigSecretArns
      Tags:
        - Key: Service
          Value: interoves-workers
        - Key: Worker
          Value: !Ref WorkerName

  PublishRecheckOutboxPolicy:
    Type: AWS::IAM::Policy
    Condition: IsRecheck
    Properties:
      PolicyName: PublishRecheckOutbox
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublishRecheckOutbox
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !Ref QueueArn

  ValidationQueuePolicy:
    Type: AWS::IAM::Policy
    Condition: HasValidationQueue
    Properties:
      PolicyName: ConsumeDisposableValidationQueue
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ConsumeDisposableValidationQueue
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
            Resource: !Ref ValidationQueueArn

Outputs:
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
