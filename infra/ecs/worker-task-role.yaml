AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege ECS task role for one Interoves worker.

Parameters:
  WorkerName:
    Type: String
    AllowedValues: [background, identity, integrations, recheck]
  QueueArn:
    Type: String
  ConfigSecretArns:
    Type: CommaDelimitedList
    Description: Exact Secrets Manager ARNs referenced by the worker config map.
  ValidationQueueArn:
    Type: String
    Default: ''
    Description: Optional disposable validation queue; omit for normal deployments.
  SocialQueueS3Bucket:
    Type: String
    Default: interoves-django-static
    Description: Bucket used for integrations social-queue images.

Conditions:
  HasValidationQueue: !Not [!Equals [!Ref ValidationQueueArn, '']]
  IsRecheck: !Equals [!Ref WorkerName, recheck]
  IsIdentity: !Equals [!Ref WorkerName, identity]
  IsIntegrations: !Equals [!Ref WorkerName, integrations]

Resources:
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub interoves-${WorkerName}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConsumeConfiguredWorkerQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConsumeConfiguredWorkerQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !Ref QueueArn
        - PolicyName: ReadWorkerRuntimeConfiguration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWorkerRuntimeConfiguration
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !Ref ConfigSecretArns
      Tags:
        - Key: Service
          Value: interoves-workers
        - Key: Worker
          Value: !Ref WorkerName

  PublishRecheckOutboxPolicy:
    Type: AWS::IAM::Policy
    Condition: IsRecheck
    Properties:
      PolicyName: PublishRecheckOutbox
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublishRecheckOutbox
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !Ref QueueArn

  PublishRecheckMetricsPolicy:
    Type: AWS::IAM::Policy
    Condition: IsRecheck
    Properties:
      PolicyName: PublishRecheckMetrics
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublishRecheckMetrics
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: InterOves/Recheck

  PublishIdentityContinuationPolicy:
    Type: AWS::IAM::Policy
    Condition: IsIdentity
    Properties:
      PolicyName: PublishIdentityContinuation
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublishIdentityContinuation
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !Ref QueueArn

  ValidationQueuePolicy:
    Type: AWS::IAM::Policy
    Condition: HasValidationQueue
    Properties:
      PolicyName: ConsumeDisposableValidationQueue
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ConsumeDisposableValidationQueue
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
            Resource: !Ref ValidationQueueArn

  IntegrationsSocialQueueStoragePolicy:
    Type: AWS::IAM::Policy
    Condition: IsIntegrations
    Properties:
      PolicyName: IntegrationsSocialQueueStorage
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadWriteSocialQueueImages
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub arn:aws:s3:::${SocialQueueS3Bucket}/media/social_queue/*

Outputs:
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
