AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repository for immutable Interoves worker images.

Parameters:
  RepositoryName:
    Type: String
    Default: interoves-workers
  KeepTaggedImages:
    Type: Number
    Default: 20
    MinValue: 1

Resources:
  WorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged images",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Keep only recent tagged worker images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["worker-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": ${KeepTaggedImages}
                },
                "action": {"type": "expire"}
              }
            ]
          }

Outputs:
  RepositoryArn:
    Value: !GetAtt WorkerRepository.Arn
  RepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
