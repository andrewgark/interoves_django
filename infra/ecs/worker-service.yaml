AWSTemplateFormatVersion: '2010-09-09'
Description: Parameterized Interoves worker service for ECS Fargate or Fargate Spot.

Parameters:
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  WorkerName:
    Type: String
    AllowedValues: [background, identity, integrations, recheck]
  RuntimeRole:
    Type: String
  DeploymentMode:
    Type: String
    AllowedValues: [ecs-fargate, ecs-fargate-spot]
  ImageUri:
    Type: String
    Description: Immutable application image URI, preferably including a digest.
  ImageCommit:
    Type: String
    Description: Git commit identifier baked into the worker image.
  TaskExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
  QueueUrl:
    Type: String
  ConfigSecretArn:
    Type: String
    NoEcho: true
    Default: ''
  ConfigSecretMap:
    Type: String
    NoEcho: true
    Default: '{}'
  ConfigEnvJson:
    Type: String
    NoEcho: true
    Default: '{}'
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  AssignPublicIp:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
  Cpu:
    Type: String
    Default: '512'
  Memory:
    Type: String
    Default: '1024'
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
  LogGroupName:
    Type: String
  LogRetentionDays:
    Type: Number
    Default: 30
  IsProd:
    Type: String
    Default: 'TRUE'
  DebugOn:
    Type: String
    Default: 'FALSE'
  AsgiThreads:
    Type: String
    Default: '1'
  RdsSecretArn:
    Type: String
    NoEcho: true
  RdsDbName:
    Type: String
    Default: ebdb
  RdsHostname:
    Type: String
  RdsPort:
    Type: String
    Default: '3306'
  RdsUsername:
    Type: String
    Default: admin
  RedisHost:
    Type: String
  RedisPort:
    Type: String
    Default: '6379'
  RedisTls:
    Type: String
    Default: '1'
  UseS3:
    Type: String
    Default: 'FALSE'
  ExtraAllowedHosts:
    Type: String
    Default: localhost
  TributeClubSubscriptionEurId:
    Type: String
  TributeClubSubscriptionEurUrl:
    Type: String

Conditions:
  IsSpot: !Equals [!Ref DeploymentMode, ecs-fargate-spot]
  IsRecheck: !Equals [!Ref WorkerName, recheck]
  IsIdentity: !Equals [!Ref WorkerName, identity]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: !Ref LogRetentionDays

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      Tags:
        - Key: interoves:commit
          Value: !Ref ImageCommit
      ContainerDefinitions:
        - Name: !Ref WorkerName
          Image: !Ref ImageUri
          Essential: true
          WorkingDirectory: /app
          Command:
            - run_worker
            - --worker
            - !Ref WorkerName
            - --mode
            - !Ref DeploymentMode
          Environment:
            - Name: INTEROVES_RUNTIME_ROLE
              Value: !Ref RuntimeRole
            - Name: INTEROVES_WORKER_NAME
              Value: !Ref WorkerName
            - Name: INTEROVES_IMAGE_COMMIT
              Value: !Ref ImageCommit
            - Name: INTEROVES_DEPLOYMENT_MODE
              Value: !Ref DeploymentMode
            - Name: WORKER_QUEUE_URL
              Value: !Ref QueueUrl
            - Name: RECHECK_SQS_QUEUE_URL
              Value: !If [IsRecheck, !Ref QueueUrl, '']
            - Name: ANONYMOUS_MERGE_SQS_QUEUE_URL
              Value: !If [IsIdentity, !Ref QueueUrl, '']
            - Name: IDENTITY_SQS_QUEUE_URL
              Value: !If [IsIdentity, !Ref QueueUrl, '']
            - Name: ANONYMOUS_MERGE_EVENTS
              Value: !If [IsIdentity, '1', '']
            - Name: INTEROVES_CLOUDWATCH_METRICS
              Value: !If [IsRecheck, '1', '']
            - Name: INTEROVES_CONFIG_SECRET_ID
              Value: !Ref ConfigSecretArn
            - Name: INTEROVES_CONFIG_SECRET_MAP
              Value: !Ref ConfigSecretMap
            - Name: INTEROVES_CONFIG_VALUES
              Value: !Ref ConfigEnvJson
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: DJANGO_SETTINGS_MODULE
              Value: interoves_django.settings
            - Name: IS_PROD
              Value: !Ref IsProd
            - Name: DEBUG_ON
              Value: !Ref DebugOn
            - Name: ASGI_THREADS
              Value: !Ref AsgiThreads
            - Name: RDS_SECRET_ARN
              Value: !Ref RdsSecretArn
            - Name: RDS_DB_NAME
              Value: !Ref RdsDbName
            - Name: RDS_HOSTNAME
              Value: !Ref RdsHostname
            - Name: RDS_PORT
              Value: !Ref RdsPort
            - Name: RDS_USERNAME
              Value: !Ref RdsUsername
            - Name: REDIS_HOST
              Value: !Ref RedisHost
            - Name: REDIS_PORT
              Value: !Ref RedisPort
            - Name: REDIS_TLS
              Value: !Ref RedisTls
            - Name: USE_S3
              Value: !Ref UseS3
            - Name: EXTRA_ALLOWED_HOSTS
              Value: !Ref ExtraAllowedHosts
            - Name: TRIBUTE_CLUB_SUBSCRIPTION_EUR_ID
              Value: !Ref TributeClubSubscriptionEurId
            - Name: TRIBUTE_CLUB_SUBSCRIPTION_EUR_URL
              Value: !Ref TributeClubSubscriptionEurUrl
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref WorkerName

  Service:
    Type: AWS::ECS::Service
    DependsOn: LogGroup
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ClusterName
      DesiredCount: !Ref DesiredCount
      CapacityProviderStrategy:
        - CapacityProvider: !If [IsSpot, FARGATE_SPOT, FARGATE]
          Weight: 1
      TaskDefinition: !Ref TaskDefinition
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: !Ref SecurityGroupIds
          AssignPublicIp: !Ref AssignPublicIp

Outputs:
  ServiceName:
    Value: !Ref Service
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
