# Elastic Beanstalk Nginx configuration. This mirrors the platform default but
# leaves access_log ownership to conf.d/elasticbeanstalk/00_timing_access_log.conf.
# That prevents the default log (which uses $request and therefore query strings)
# from being written alongside the safe Inter Oves format.

user                    nginx;
error_log               /var/log/nginx/error.log warn;
pid                     /var/run/nginx.pid;
worker_processes        auto;
worker_rlimit_nofile    200000;

events {
    worker_connections  1024;
}

http {
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Kept safe even though the application server uses interoves_timing.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    include       conf.d/*.conf;

    map $http_upgrade $connection_upgrade {
        default "upgrade";
    }

    server {
        listen 80 default_server;

        client_header_timeout 60;
        client_body_timeout   60;
        keepalive_timeout     60;
        gzip                  off;
        gzip_comp_level       4;
        gzip_types text/plain text/css application/json application/javascript
                   application/x-javascript text/xml application/xml
                   application/xml+rss text/javascript;

        # Includes application proxying, canonical host redirect, healthd,
        # static/media proxies, and the single safe access_log directive.
        include conf.d/elasticbeanstalk/*.conf;
    }
}
