# Use the standard EB access-log path so built-in CloudWatch log streaming also
# receives request/upstream timings. This server-level directive overrides the
# inherited default combined log rather than writing every request twice.
# Only errors and slow requests are written; see $interoves_access_loggable.
access_log /var/log/nginx/access.log interoves_timing if=$interoves_access_loggable;
