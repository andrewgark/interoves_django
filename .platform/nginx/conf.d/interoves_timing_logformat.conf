# Included at http{} level (see /var/proxy/staging/nginx/nginx.conf).
log_format interoves_timing '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'host="$host" request_id=$request_id '
    'app_request_id="$upstream_http_x_request_id" instance="$hostname" '
    'rt=$request_time urt=$upstream_response_time '
    '"$http_user_agent"';
