# Included at http{} level (see /var/proxy/staging/nginx/nginx.conf).
map $uri $interoves_safe_uri {
    default $uri;
    ~^/censorly/r/[^/]+(/.*)?$ /censorly/r/<share_hash>$1;
    "~^/(ladder|salad|alphabetty|replacements)/[a-f0-9]{16,32}(/.*)?$" /$1/<share_hash>$2;
    ~^/donate/status/[^/]+(/.*)?$ /donate/status/<token>$1;
    ~^(.*/)?team/invite/[^/]+(/.*)?$ $1team/invite/<token>$2;
    ~^/anon-merge-jobs/[^/]+(/.*)?$ /anon-merge-jobs/<job_id>$1;
    ~^/profile/merge/status/[^/]+(/.*)?$ /profile/merge/status/<job_id>$1;
    ~^/actor/anon/[^/]+(/.*)?$ /actor/anon/<anon_key>$1;
    ~^/telegram/webhook/[^/]+(/.*)?$ /telegram/webhook/<secret>$1;
}

log_format interoves_timing '[$time_local] '
    '"$request_method $interoves_safe_uri $server_protocol" $status $body_bytes_sent '
    'host="$host" request_id=$request_id '
    'app_request_id="$upstream_http_x_request_id" trace_id="$http_x_amzn_trace_id" '
    'instance="$hostname" upstream_addr="$upstream_addr" '
    'upstream_status="$upstream_status" '
    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
    'urt=$upstream_response_time';
